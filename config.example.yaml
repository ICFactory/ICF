# Example configuration for Video-to-Shorts
# Copy this file to config.yaml and edit as needed.

project:
  name: "video-to-shorts"
  version: "0.1.0"

paths:
  input_dir: "input"
  output_dir: "output"
  temp_dir: "temp"

ffmpeg:
  # Leave empty if ffmpeg is in PATH, otherwise put full path
  # Example for Windows: "C:/ffmpeg/bin/ffmpeg.exe"
  executable: ""
  
  # Default vertical resolution
  width: 1080
  height: 1920
  
  # Video codec settings (good quality / reasonable size)
  video_codec: "libx264"
  crf: 20
  preset: "medium"
  audio_codec: "aac"
  audio_bitrate: "128k"

# Future stages (not used yet)
whisper:
  model: "medium"          # tiny / base / small / medium / large-v2
  language: "en"

llm:
  provider: "remote"       # "remote" for now (Ollama later)
  model: "llama3.2"

shorts:
  min_duration: 15         # seconds
  max_duration: 59
  target_count: 6